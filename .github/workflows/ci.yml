name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Elevate per-job, never globally.
permissions:
  contents: read

# Cancel superseded PR runs — that is what this setting is for. Never cancel a
# run on main: since D49 those runs deploy to production, and killing one
# mid-upload leaves the live site half-written with no error anywhere.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` not `npm install` — installs exactly the lockfile, and fails
      # if package.json and the lock have drifted.
      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The hard performance gate. Deterministic, unlike Lighthouse.
      - name: JavaScript byte budget
        run: npm run budget

      # Six site-wide navigation links were 404s for three PRs because nothing
      # was checking. Now something is.
      - name: Internal links
        run: npm run links

      # Astro trims the newline between prose and an inline element, so
      # "we keep anyway:" + <strong> renders as "anyway:if". Invisible in the
      # source and in review; only exists in the built HTML.
      - name: Prose spacing
        run: npm run spacing

      # STATE.md claimed 11 pages for two PRs while the build made 10. It was
      # the only number in that table not printed by a gate, and the only one
      # that was wrong.
      - name: STATE.md matches the build
        run: npm run state

      # Static prose reaches the islands as named slots, and TypeScript cannot
      # see slots as props — so a page that forgets one type-checks, builds, and
      # ships with a rule 8 disclosure missing.
      - name: Island prose slots
        run: npm run slots

      # Person schema was absent from every page for seventeen PRs while
      # CLAUDE.md required it. On a YMYL site that is the trust signal, and
      # its absence is silent.
      - name: Structured data
        run: npm run schema

      # /biweekly-mortgage-payments shipped and was absent from llms.txt for two
      # PRs, so the page most likely to be quoted for a fortnightly-payments
      # question was invisible to the file that exists to serve exactly that.
      # Fourth time a page has existed without appearing where something looks
      # for it (D41, D50, D61).
      - name: llms.txt catalogue
        run: npm run llms

      # Configuration Cloudflare reads that no other gate sees. _headers is
      # parsed at DEPLOY time, after CI — the first deploy failed on an empty
      # header value for an /embed/* route that never existed. And html_handling
      # must agree with Astro's trailingSlash, or every page is a 307 whose
      # canonical contradicts it, which is what the first deploy actually did.
      - name: Deploy config
        run: npm run deploy-config

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan the whole tree, not just the diff.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Production ──────────────────────────────────────────────────────────────
  #
  # Merging to main IS the release (D49). Before this job existed, `main` and
  # the live site drifted apart silently: production only moved when someone
  # remembered to run `npx wrangler deploy` by hand, from a working tree that
  # might be on any branch.
  #
  # That is not hypothetical. It happened twice during launch — once deploying
  # a wrangler.toml from a stale branch, so a merged fix never reached the site
  # while every dashboard said it had.
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    # Production can only ever receive a commit that passed all ten gates.
    needs: [verify, secret-scan]

    # Merges only. A pull request must never touch the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # NOT optional, and the reason is a real defect. `wrangler deploy` uploads
      # ./dist exactly as it finds it — it does not build. A deploy without this
      # step ships whatever happened to be on disk, which during launch meant
      # shipping the previous commit's output while reporting success.
      - name: Build
        run: npm run build

      # `npx wrangler` rather than cloudflare/wrangler-action. A third-party
      # action in the release path is a supply-chain dependency holding a token
      # that can rewrite the live site, added to save four lines. Rule 4's
      # reasoning applies to CI as much as to npm.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

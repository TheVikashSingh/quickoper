name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Elevate per-job, never globally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` not `npm install` — installs exactly the lockfile, and fails
      # if package.json and the lock have drifted.
      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The hard performance gate. Deterministic, unlike Lighthouse.
      - name: JavaScript byte budget
        run: npm run budget

      # Six site-wide navigation links were 404s for three PRs because nothing
      # was checking. Now something is.
      - name: Internal links
        run: npm run links

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan the whole tree, not just the diff.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
